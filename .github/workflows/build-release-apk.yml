name: Build Release APK

# Runs on every push to main and on demand. The workflow is designed so that a
# fresh clone with **no repository secrets at all** still produces an installable,
# debug-signed release APK: the signing step falls back to the Android debug
# keystore instead of failing. Add the four signing secrets to get a properly
# signed build.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to pre-check in the log (no model is ever bundled)'
        required: false
        default: 'Qwen2.5-1.5B-Instruct-Q4_K_M'
        type: choice
        options:
          - Qwen2.5-1.5B-Instruct-Q4_K_M
          - Gemma-2-2B-It-Q4_K_M
          - Qwen2.5-0.5B-Instruct-Q4_K_M

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.7'
  FLUTTER_CHANNEL: 'stable'
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK_VERSION: '28.2.13676358'
  CMAKE_VERSION: '3.31.6'
  APP_ARTIFACT: 'app-arm64-v8a-release.apk'

jobs:
  build:
    name: Analyze, test and build arm64-v8a APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Flutter SDK and pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            /opt/flutter
          key: flutter-${{ env.FLUTTER_CHANNEL }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-${{ env.FLUTTER_VERSION }}-

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          set -euo pipefail
          if [ ! -d /opt/flutter/.git ]; then
            git clone --depth 1 --branch "${FLUTTER_VERSION}" \
              https://github.com/flutter/flutter.git /opt/flutter
          fi
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          export PATH="/opt/flutter/bin:$PATH"
          flutter --version
          flutter config --no-analytics
          dart --disable-analytics

      - name: Flutter precache (Android + engine artefacts)
        run: flutter precache --android --universal

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib || true

      - name: Static analysis
        # Informational on purpose. The release build below is the authoritative
        # compile check — it fails on any real error — while this step exists to
        # surface lints without letting a style nit block a release.
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test --reporter expanded
        continue-on-error: true

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/keystore

          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && \
             [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "Using repository signing secrets."
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/release.jks
            {
              echo "storeFile=keystore/release.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets found. Generating a throwaway keystore so the release APK is still installable."
            keytool -genkeypair -v \
              -keystore android/keystore/release.jks \
              -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias k100-ci \
              -storepass k100ci-temporary \
              -keypass k100ci-temporary \
              -dname "CN=K100 CI, OU=Build, O=K100, L=Seoul, S=Seoul, C=KR" > /dev/null
            {
              echo "storeFile=keystore/release.jks"
              echo "storePassword=k100ci-temporary"
              echo "keyAlias=k100-ci"
              echo "keyPassword=k100ci-temporary"
            } > android/key.properties
            echo "signed=ci-temporary" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure local.properties
        run: |
          set -euo pipefail
          cat > android/local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          flutter.sdk=/opt/flutter
          flutter.buildMode=release
          flutter.versionName=1.0.0
          flutter.versionCode=1
          EOF
          cat android/local.properties

      - name: Enforce arm64-v8a only and no bundled weights
        run: |
          set -euo pipefail
          grep -q "abiFilters \"arm64-v8a\"" android/app/build.gradle \
            || { echo "::error::abiFilters must be arm64-v8a only"; exit 1; }
          python3 - <<'PY'
          import pathlib, sys
          bad = [p for p in pathlib.Path('.').rglob('*')
                 if p.is_file() and p.suffix.lower() in {'.gguf', '.ggml', '.bin'}
                 and 'build' not in p.parts and '.git' not in p.parts]
          if bad:
              print('::error::Model weights must never be committed:', bad)
              sys.exit(1)
          print('No bundled model weights found.')
          PY

      - name: Build release APK (split per ABI)
        run: |
          set -euo pipefail
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm64 \
            --dart-define=K100_VERSION=1.0.0 \
            2>&1 | tee build.log

      - name: Locate and rename the APK
        id: apk
        run: |
          set -euo pipefail
          SRC="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "Expected $SRC not found. Contents of the output folder:"
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi
          mkdir -p dist
          cp "$SRC" "dist/${APP_ARTIFACT}"
          ls -lh dist/
          echo "sha256=$(sha256sum "dist/${APP_ARTIFACT}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "dist/${APP_ARTIFACT}")" >> "$GITHUB_OUTPUT"

      - name: Verify APK contents (arm64 only, nothing huge)
        run: |
          set -euo pipefail
          APK="dist/${APP_ARTIFACT}"
          unzip -l "$APK" | awk '{print $4}' | grep -E '^lib/' | sort -u | tee libs.txt
          if grep -qvE '^lib/arm64-v8a/' libs.txt; then
            echo "::error::The APK contains libraries outside lib/arm64-v8a/"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -gt 125829120 ]; then
            echo "::error::APK is larger than 120 MB — a model file was probably bundled."
            exit 1
          fi
          echo "APK is $((SIZE / 1024 / 1024)) MB, arm64-v8a only."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: k100-arm64-v8a-release
          path: dist/${{ env.APP_ARTIFACT }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k100-build-log
          path: |
            build.log
            android/app/build/outputs/logs/*.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: K100 1.0.0 (build ${{ github.run_number }})
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/${{ env.APP_ARTIFACT }}
          body: |
            **K100 — offline AI language speaking tutor**

            Install `app-arm64-v8a-release.apk` on any Android 8.0+ (arm64) phone.

            * Everything runs on-device: the language model, speech recognition and
              speech synthesis. No API keys, no subscription, no cloud inference.
            * The app ships **without** model weights. On first run, choose a model
              and K100 downloads the `.gguf` (~0.5–1.7 GB) from Hugging Face into the
              app's documents directory, with pause and resume.
            * Requires Android 8.0 or newer and a 64-bit ARM device.
            * Signing: ${{ steps.keystore.outputs.signed }}.
              ${{ steps.keystore.outputs.signed == 'ci-temporary' && 'This build is signed with a throwaway CI key — installable, but Android will refuse to upgrade it over a differently-signed build.' || 'Signed with the repository release key.' }}

            SHA-256: `${{ steps.apk.outputs.sha256 }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
