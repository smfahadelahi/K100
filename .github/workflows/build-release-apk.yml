name: Build Release APK

# Runs on every push to main and on demand. The workflow is designed so that a
# fresh clone with **no repository secrets at all** still produces an installable
# release APK: the signing step falls back to a throwaway keystore instead of
# failing. Add the four signing secrets to get a properly signed build.
#
# Two conventions make this workflow debuggable from a phone:
#
#  * every risky command tees to a log file, and on failure the tail of that log
#    is re-emitted as a GitHub `::error::` annotation, which is readable through
#    the API even when the raw job logs are not;
#  * nothing depends on a third-party setup action that can break on its own —
#    the Android SDK tooling is located (or fetched) explicitly.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model this build targets (no weights are ever bundled)'
        required: false
        default: 'Qwen2.5-1.5B-Instruct-Q4_K_M'
        type: choice
        options:
          - Qwen2.5-1.5B-Instruct-Q4_K_M
          - Gemma-2-2B-It-Q4_K_M
          - Qwen2.5-0.5B-Instruct-Q4_K_M

# The APK is published as a release asset, which needs a writable token.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.35.7'
  FLUTTER_CHANNEL: 'stable'
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'
  ANDROID_NDK_VERSION: '28.2.13676358'
  # The NDK the llama.cpp plugin module declares for itself; installed so AGP
  # never has to fetch it during the native build.
  ANDROID_PLUGIN_NDK_VERSION: '28.0.12674087'
  CMAKE_VERSION: '3.31.6'
  APP_ARTIFACT: 'app-arm64-v8a-release.apk'

jobs:
  build:
    name: Analyze, test and build arm64-v8a APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        # A full llama.cpp build plus three Gradle caches is the heaviest thing
        # this workflow does; dropping preinstalled toolchains this job never
        # touches keeps it from dying with "No space left on device".
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/ndk/2[0-6].* 2>/dev/null || true
          df -h / | tail -1

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Locate the Android SDK
        id: sdk
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"

          SDKMANAGER="$(find "$SDK_ROOT" -maxdepth 6 -name sdkmanager -type f 2>/dev/null | head -1 || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "No cmdline-tools in $SDK_ROOT — fetching the official package."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-unpack
            mv /tmp/cmdline-tools-unpack/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk_root=$SDK_ROOT" >> "$GITHUB_OUTPUT"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          "$SDKMANAGER" --version | tee /tmp/sdk.version || true

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="${{ steps.sdk.outputs.sdkmanager }}"
          SDK_ROOT="${{ steps.sdk.outputs.sdk_root }}"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          install() {
            local pkg="$1"
            if ! "$SDKMANAGER" --install "$pkg" > /tmp/sdk-install.log 2>&1; then
              echo "::error title=SDK package failed::$pkg — $(tail -c 300 /tmp/sdk-install.log | tr '\n' ' ' | sed 's/%/%25/g')"
              return 1
            fi
            echo "installed $pkg"
          }

          install "platform-tools"
          install "platforms;android-${ANDROID_API_LEVEL}"
          install "build-tools;${ANDROID_BUILD_TOOLS}"
          install "ndk;${ANDROID_NDK_VERSION}"

          install "ndk;${ANDROID_PLUGIN_NDK_VERSION}" || \
            echo "::warning title=Plugin NDK unavailable::$ANDROID_PLUGIN_NDK_VERSION is not in the SDK repository; relying on the pinned override in android/build.gradle."

          # CMake: the llama.cpp plugin asks for a 3.31 line, AGP's own default
          # is 3.22. Install *all* plausible versions — AGP fails hard when a
          # module pins an exact version that is absent, and the extras cost a few
          # MB each.
          installed_cmake=0
          for pkg in "cmake;${CMAKE_VERSION}" "cmake;3.31.0" "cmake;3.22.1"; do
            if "$SDKMANAGER" --install "$pkg" > /tmp/sdk-cmake.log 2>&1; then
              echo "installed $pkg"
              installed_cmake=$((installed_cmake + 1))
            else
              echo "::warning title=CMake unavailable::$pkg is not in the SDK repository."
            fi
          done
          if [ "$installed_cmake" -eq 0 ]; then
            echo "::error title=No CMake::No CMake package could be installed; the native engine cannot build."
            exit 1
          fi
          ls "$SDK_ROOT/cmake" || true

          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          ls "$SDK_ROOT/ndk" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Flutter SDK and pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            /opt/flutter
          key: flutter-${{ env.FLUTTER_CHANNEL }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            flutter-${{ env.FLUTTER_CHANNEL }}-${{ env.FLUTTER_VERSION }}-

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          set -euo pipefail
          if [ ! -d /opt/flutter/.git ]; then
            git clone --depth 1 --branch "${FLUTTER_VERSION}" \
              https://github.com/flutter/flutter.git /opt/flutter
          fi
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          git -C /opt/flutter describe --tags 2>/dev/null || true

      - name: Flutter version and precache
        run: |
          set -euo pipefail
          export PATH="/opt/flutter/bin:$PATH"
          flutter --version | tee /tmp/flutter.version
          flutter config --no-analytics > /dev/null || true
          dart --disable-analytics > /dev/null || true
          # Populates the cached artefacts, including the Gradle wrapper the
          # Flutter tool injects into android/.
          flutter precache --android 2>&1 | tail -5 || \
            echo "::warning title=precache::flutter precache reported an error; continuing."

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          export PATH="/opt/flutter/bin:$PATH"
          if ! flutter pub get > /tmp/pub-get.log 2>&1; then
            echo "::error title=pub get failed::$(tail -c 600 /tmp/pub-get.log | tr '\n' ' ' | sed 's/%/%25/g')"
            exit 1
          fi
          tail -5 /tmp/pub-get.log

      - name: Verify formatting
        continue-on-error: true
        run: |
          export PATH="/opt/flutter/bin:$PATH"
          dart format --output=none --set-exit-if-changed lib || true

      - name: Static analysis
        # Informational on purpose — the release build below is the authoritative
        # compile check — but a failure is reported as an annotation so it cannot
        # hide: `::warning::` lines are readable through the API even when the raw
        # job log is not.
        continue-on-error: true
        run: |
          export PATH="/opt/flutter/bin:$PATH"
          set +e
          flutter analyze --no-fatal-infos > /tmp/analyze.log 2>&1
          status=$?
          tail -30 /tmp/analyze.log
          if [ "$status" -ne 0 ]; then
            echo "::warning title=flutter analyze failed::$(grep -cE ' (error|warning) ' /tmp/analyze.log) issues; first: $(grep -m1 -E ' (error|warning) ' /tmp/analyze.log | cut -c1-200 | sed 's/%/%25/g')"
          else
            echo "::notice title=flutter analyze::clean"
          fi
          exit 0

      - name: Unit tests
        continue-on-error: true
        run: |
          export PATH="/opt/flutter/bin:$PATH"
          set +e
          flutter test --reporter expanded > /tmp/test.log 2>&1
          status=$?
          tail -30 /tmp/test.log
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Unit tests failed::$(tail -c 400 /tmp/test.log | tr '\n' ' ' | sed 's/%/%25/g')"
          else
            echo "::notice title=Unit tests::$({ grep -oE '\+[0-9]+' /tmp/test.log | tail -1; } tests passed)"
          fi
          exit 0

      - name: Prepare signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/keystore

          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && \
             [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "Using repository signing secrets."
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/release.jks
            {
              echo "storeFile=keystore/release.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Unsigned build::No signing secrets found — generating a throwaway keystore so the release APK is still installable."
            keytool -genkeypair -v \
              -keystore android/keystore/release.jks \
              -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias k100-ci \
              -storepass k100ci-temporary \
              -keypass k100ci-temporary \
              -dname "CN=K100 CI, OU=Build, O=K100, L=Seoul, S=Seoul, C=KR" > /dev/null
            {
              echo "storeFile=keystore/release.jks"
              echo "storePassword=k100ci-temporary"
              echo "keyAlias=k100-ci"
              echo "keyPassword=k100ci-temporary"
            } > android/key.properties
            echo "signed=ci-temporary" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure local.properties
        run: |
          set -euo pipefail
          cat > android/local.properties <<EOF
          sdk.dir=${ANDROID_SDK_ROOT}
          flutter.sdk=/opt/flutter
          flutter.buildMode=release
          flutter.versionName=1.0.0
          flutter.versionCode=1
          EOF
          cat android/local.properties

      - name: Repository sanity (no ignored source, no bundled weights)
        run: |
          set -euo pipefail

          # Git says nothing when an ignore rule swallows a *source* directory.
          # That is exactly how the entire `lib/models/` layer once failed to
          # reach this build, which surfaced only as 694 analyzer errors. Both
          # directions are checked here.
          ignored="$(git ls-files --others --ignored --exclude-standard -- 'lib/**' | head -20 || true)"
          if [ -n "$ignored" ]; then
            echo "::error title=Ignored source::Files under lib/ are excluded by .gitignore: $(echo "$ignored" | tr '\n' ' ')"
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- 'lib/**' 'test/**' | head -20 || true)"
          if [ -n "$untracked" ]; then
            echo "::error title=Untracked source::Source files are not committed: $(echo "$untracked" | tr '\n' ' ')"
            exit 1
          fi

          missing=""
          for f in lib/main.dart \
                   lib/core/constants.dart lib/core/theme.dart \
                   lib/models/ai_response.dart lib/models/tutor_state.dart \
                   lib/models/chat_message.dart lib/models/learner_profile.dart \
                   lib/services/voice_pipeline_controller.dart \
                   android/app/src/main/AndroidManifest.xml \
                   pubspec.yaml; do
            git ls-files --error-unmatch "$f" > /dev/null 2>&1 || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing source::Not tracked by git:$missing"
            exit 1
          fi

          count="$(git ls-files 'lib/**/*.dart' 'lib/*.dart' | wc -l)"
          echo "$count Dart files under lib/ are tracked."
          if [ "$count" -lt 30 ]; then
            echo "::error title=Thin checkout::Only $count Dart files are tracked; the lib/ tree looks incomplete."
            exit 1
          fi

          # The ABI restriction: the Flutter tool derives it from this flag, and
          # the APK-content check below proves the result.
          grep -q -- '--target-platform android-arm64' .github/workflows/build-release-apk.yml \
            || { echo "::error title=ABI::The build must target android-arm64."; exit 1; }

          python3 - <<'PY'
          import pathlib, sys
          bad = [str(p) for p in pathlib.Path('.').rglob('*')
                 if p.is_file() and p.suffix.lower() in {'.gguf', '.ggml'}
                 and 'build' not in p.parts and '.git' not in p.parts]
          if bad:
              print(f'::error title=Bundled weights::{" ".join(bad)}')
              sys.exit(1)
          print('No bundled model weights found.')
          PY

      - name: Build release APK (split per ABI)
        run: |
          set -euo pipefail
          export PATH="/opt/flutter/bin:$PATH"
          set +e
          flutter build apk \
            --release \
            --split-per-abi \
            --target-platform android-arm64 \
            > >(tee build.log) 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            # Surface the failure where it can actually be read, and point at the
            # line that matters most: Gradle prints the cause verbosely, the end
            # of the log holds the summary.
            echo "::error title=Build failed::$(tail -c 900 build.log | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-8000)"
            grep -nE "^e: |error:|ERROR:|FAILURE:|Caused by|What went wrong|Execution failed|> Task .* FAILED" build.log \
              | tail -25 > gradle-errors.txt || true
            while IFS= read -r line; do
              echo "::error title=Gradle::$line" | sed 's/%/%25/g'
            done < <(tail -8 gradle-errors.txt | tr '\n' '\n')
            exit "$status"
          fi
          tail -20 build.log

      - name: Locate and rename the APK
        id: apk
        run: |
          set -euo pipefail
          SRC="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          if [ ! -f "$SRC" ]; then
            # Tolerate a naming difference (a Flutter bump renaming the split
            # output) rather than failing on a path we can find ourselves.
            SRC="$(find build/app/outputs -name '*arm64-v8a*release*.apk' -print -quit || true)"
          fi
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "::error title=No APK::No arm64-v8a release APK was produced."
            ls -laR build/app/outputs/ 2>/dev/null | head -60 || true
            exit 1
          fi
          echo "Using $SRC"
          mkdir -p dist
          cp "$SRC" "dist/${APP_ARTIFACT}"
          ls -lh dist/
          echo "sha256=$(sha256sum "dist/${APP_ARTIFACT}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "dist/${APP_ARTIFACT}")" >> "$GITHUB_OUTPUT"

      - name: Verify APK contents (arm64 only, nothing huge)
        run: |
          set -euo pipefail
          APK="dist/${APP_ARTIFACT}"
          unzip -l "$APK" | awk '{print $4}' | grep -E '^lib/' | sort -u | tee libs.txt
          if grep -qvE '^lib/arm64-v8a/' libs.txt && [ -s libs.txt ]; then
            echo "::error title=ABI leak::The APK contains libraries outside lib/arm64-v8a/"
            exit 1
          fi
          if [ ! -s libs.txt ]; then
            echo "::warning title=No native libs::The APK contains no lib/ entries — the engine plugin may not have been packaged."
          fi
          SIZE=$(stat -c%s "$APK")
          if [ "$SIZE" -gt 125829120 ]; then
            echo "::error title=APK too large::The APK is larger than 120 MB — a model file was probably bundled."
            exit 1
          fi
          echo "APK is $((SIZE / 1024 / 1024)) MB, arm64-v8a only."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: k100-arm64-v8a-release
          path: dist/${{ env.APP_ARTIFACT }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k100-build-log
          path: |
            build.log
            gradle-errors.txt
            /tmp/analyze.log
            /tmp/test.log
            /tmp/flutter.version
            /tmp/sdk.version
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: K100 v1.0.0 — offline AI language speaking tutor
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: dist/${{ env.APP_ARTIFACT }}
          body: |
            **K100 — offline AI language speaking tutor**

            Install `app-arm64-v8a-release.apk` on any Android 8.0+ (arm64) phone.

            | | |
            |---|---|
            | Version | 1.0.0 |
            | ABI | arm64-v8a only |
            | Minimum Android | 8.0 (API 26) |
            | Size | ${{ steps.apk.outputs.size }} bytes |
            | SHA-256 | `${{ steps.apk.outputs.sha256 }}` |
            | Signing | ${{ steps.keystore.outputs.signed }} |

            * Everything runs on-device: the language model, speech recognition and
              speech synthesis. No API keys, no subscription, no cloud inference.
            * The app ships **without** model weights. On first run, choose a model
              and K100 downloads the `.gguf` (~0.5–1.7 GB) from Hugging Face into the
              app's documents directory, with pause and resume.
            * First launch: pick your languages and level, download a model once, then
              tap the orb and talk. The microphone is locked while the tutor speaks,
              so it can never answer itself.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
