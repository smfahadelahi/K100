# ─── K100 Gradle configuration ────────────────────────────────────────────────
#
# Memory: the llama.cpp native build is the heaviest part of this project. 4 GB of
# heap keeps the Kotlin compiler and the C++ toolchain from fighting, and the
# metaspace bump avoids "Metaspace exhausted" on long CI runs.

org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ─── Android ──────────────────────────────────────────────────────────────────

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# ─── Flutter toolchain guards ─────────────────────────────────────────────────
#
# `skipDependencyChecks` is set because the fcllama plugin module declares an AGP
# (8.7.2) and Kotlin (2.0.21) older than the range Flutter 3.35+ validates. The
# *app* module itself is inside the supported window (Gradle 8.14.3 / AGP 8.11.1 /
# KGP 2.2.20 / Java 17). Removing this line means the build fails on the plugin's
# version, not on anything wrong with this project.
#
# The same effect can be had per-invocation with
#   flutter build apk --android-skip-build-dependency-validation
skipDependencyChecks=true
